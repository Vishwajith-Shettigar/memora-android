plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.example.timecapsule'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.timecapsule"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

secrets {
    propertiesFileName = "secrets.properties"
    defaultPropertiesFileName = "local.defaults.properties"

    // Configure which keys should be ignored by the plugin by providing regular expressions.
    // "sdk.dir" is ignored by default.
    ignoreList.add("keyToIgnore") // Ignore the key "keyToIgnore"
    ignoreList.add("sdk.*")       // Ignore all keys matching the regexp "sdk.*"
}
kapt {
    correctErrorTypes true
}
dependencies {
    implementation project(':domain')
    implementation project(':util')
    implementation project(':di')
    implementation project(':model')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.places
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.compose
    implementation project(':data')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
    implementation libs.coil.compose
    implementation libs.ui
    implementation libs.androidx.runtime
    implementation "io.coil-kt:coil-gif:2.7.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.5"

    // Google map sdk
    implementation "com.google.maps.android:maps-compose:6.1.0"

    implementation "com.google.accompanist:accompanist-permissions:0.34.0"

    //  SceneView
    implementation("io.github.sceneview:sceneview:2.1.0")
    implementation 'io.github.sceneview:arsceneview:2.2.1'

    // map box
    implementation 'com.mapbox.maps:android:11.6.0'
    // compose extension
    implementation 'com.mapbox.extension:maps-compose:11.6.0'

    // image dominnat color extractor
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation libs.androidx.navigation.compose

    implementation "androidx.compose.material:material:1.7.2"

    // Hilt
    implementation(libs.hilt.android)
    kapt(libs.hilt.android.compiler)
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    implementation(libs.firebase.firestore.ktx)

    implementation (libs.stripe.android)
    implementation ("com.github.kittinunf.fuel:fuel:2.3.1")
    implementation ("com.github.kittinunf.fuel:fuel-json:2.3.1")

    implementation "com.google.accompanist:accompanist-placeholder-material:0.31.0-alpha"
}
