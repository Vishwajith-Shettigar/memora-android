plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.example.timecapsule'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.timecapsule"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    packagingOptions{
        exclude 'AndroidManifest.xml'
        exclude 'lib/arm64-v8a/libcardioDecider.so'
        exclude 'lib/arm64-v8a/libcardioRecognizer.so'
        exclude 'lib/arm64-v8a/libcardioRecognizer_tegra2.so'
        exclude 'lib/arm64-v8a/libopencv_core.so'
        exclude 'lib/arm64-v8a/libopencv_imgproc.so'
        exclude 'lib/armeabi/libcardioDecider.so'
        exclude 'lib/armeabi-v7a/libcardioDecider.so'
        exclude 'lib/armeabi-v7a/libcardioRecognizer.so'
        exclude 'lib/armeabi-v7a/libcardioRecognizer_tegra2.so'
        exclude 'lib/armeabi-v7a/libopencv_core.so'
        exclude 'lib/armeabi-v7a/libopencv_imgproc.so'
        exclude 'lib/mips/libcardioDecider.so'
        exclude 'lib/x86/libcardioDecider.so'
        exclude 'lib/x86/libcardioRecognizer.so'
        exclude 'lib/x86/libcardioRecognizer_tegra2.so'
        exclude 'lib/x86/libopencv_core.so'
        exclude 'lib/x86/libopencv_imgproc.so'
        exclude 'lib/x86_64/libcardioDecider.so'
        exclude 'lib/x86_64/libcardioRecognizer.so'
        exclude 'lib/x86_64/libcardioRecognizer_tegra2.so'
        exclude 'lib/x86_64/libopencv_core.so'
        exclude 'lib/x86_64/libopencv_imgproc.so'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

secrets {
    propertiesFileName = "secrets.properties"
    defaultPropertiesFileName = "local.defaults.properties"

    // Configure which keys should be ignored by the plugin by providing regular expressions.
    // "sdk.dir" is ignored by default.
    ignoreList.add("keyToIgnore") // Ignore the key "keyToIgnore"
    ignoreList.add("sdk.*")       // Ignore all keys matching the regexp "sdk.*"
}
kapt {
    correctErrorTypes true
}
dependencies {
    implementation project(':domain')
    implementation project(':util')
    implementation project(':di')
    implementation project(':model')

    implementation fileTree(include: ['*.jar'], dir: 'libs')


    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.places
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.compose
    implementation project(':data')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
    implementation libs.coil.compose
    implementation libs.ui
    implementation libs.androidx.runtime
    implementation "io.coil-kt:coil-gif:2.7.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.5"

    // Google map sdk
    implementation "com.google.maps.android:maps-compose:6.1.0"

    implementation "com.google.accompanist:accompanist-permissions:0.34.0"

    //  SceneView
    implementation("io.github.sceneview:sceneview:2.1.0")
    implementation 'io.github.sceneview:arsceneview:2.2.1'

    // map box
    implementation 'com.mapbox.maps:android:11.9.0'
    // compose extension
    implementation 'com.mapbox.extension:maps-compose:11.9.0'

    // image dominnat color extractor
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation libs.androidx.navigation.compose

    implementation "androidx.compose.material:material:1.7.2"

    // Hilt
    implementation(libs.hilt.android)
    kapt(libs.hilt.android.compiler)
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    implementation(libs.firebase.firestore.ktx)
    implementation libs.firebase.messaging

    implementation(libs.stripe.android)
    implementation("com.github.kittinunf.fuel:fuel:2.3.1")
    implementation("com.github.kittinunf.fuel:fuel-json:2.3.1")

    implementation "com.google.accompanist:accompanist-placeholder-material:0.31.0-alpha"

    implementation "com.google.accompanist:accompanist-swiperefresh:0.36.0"

    implementation "com.google.accompanist:accompanist-pager:0.28.0"
    implementation "com.google.accompanist:accompanist-pager-indicators:0.28.0"

    implementation "com.google.accompanist:accompanist-systemuicontroller:0.28.0"

    def room_version = "2.6.0"
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp "androidx.room:room-compiler:$room_version"

    // Testing dependencies.

    // JUnit for unit testing
    testImplementation 'junit:junit:4.13.2'

    // Mockito for mocking dependencies
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:4.1.0'

    // Coroutines testing
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    // Robolectric (optional)
    testImplementation 'org.robolectric:robolectric:4.10'

    testImplementation "com.google.dagger:hilt-android-testing:2.50"
    kaptTest "com.google.dagger:hilt-android-compiler:2.50"
    testImplementation "org.mockito:mockito-inline:4.1.0"

    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.6.8"
    androidTestImplementation "androidx.compose.ui:ui-test-manifest:1.6.8" // Optional, for manifest support
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.8" // For preview support in tests
    testImplementation "androidx.compose.ui:ui-test-junit4:1.6.8"

}
